<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 2 Study Lab</title><style>
:root{--bg:#0f172a;--panel:#111c35;--card:#182541;--text:#f8fafc;--muted:#9fb0cc;--accent:#7c3aed;--good:#22c55e;--bad:#ef4444;--line:#2b3a5c}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(135deg,#0b1020,#111827);color:var(--text);min-height:100vh}.app{max-width:980px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.brand{font-size:26px;font-weight:800}.pill{background:#1f2b46;padding:8px 12px;border-radius:999px;color:#cbd5e1}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:#243250;color:#fff}button.active,button.primary{background:var(--accent)}button:hover{filter:brightness(1.1)}.panel{background:rgba(17,28,53,.92);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 20px 60px #0004}.progress{height:9px;background:#26334f;border-radius:20px;overflow:hidden;margin:12px 0 20px}.bar{height:100%;background:linear-gradient(90deg,#7c3aed,#22c55e);width:0}.flash{min-height:330px;background:var(--card);border:1px solid #314264;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;padding:38px;font-size:30px;font-weight:750;cursor:pointer;user-select:none}.flash .def{font-size:20px;font-weight:500;line-height:1.55}.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}.row{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}.choices{display:grid;gap:10px;margin-top:18px}.choice{text-align:left;padding:15px;border:1px solid var(--line);background:#17233d}.choice.good{background:#123d29;border-color:#22c55e}.choice.bad{background:#471d27;border-color:#ef4444}.q{font-size:22px;font-weight:800;line-height:1.35}.small{color:var(--muted);font-size:14px}.input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0f1930;color:#fff;font-size:16px;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat{background:#17233d;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}.big{font-size:26px;font-weight:900}.terms{display:grid;gap:10px}.termrow{background:#17233d;border:1px solid var(--line);border-radius:14px;padding:15px}.termrow b{display:block;margin-bottom:6px}.hidden{display:none}@media(max-width:650px){.app{padding:14px}.flash{min-height:280px;font-size:25px;padding:24px}.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app"><div class="top"><div><div class="brand">Chapter 2 Study Lab</div><div class="small">47 motherboard & firmware key terms</div></div><div class="pill" id="mastery">0 mastered</div></div><div class="tabs"><button id="t-flash" class="active" onclick="mode('flash')">Flashcards</button><button id="t-learn" onclick="mode('learn')">Learn</button><button id="t-test" onclick="mode('test')">Test</button><button id="t-practice" onclick="mode('practice')">Practice Questions</button><button id="t-terms" onclick="mode('terms')">Terms</button></div><div class="panel"><div id="view"></div></div></div><script>
const cards=[{"term": "AM3+", "def": "A type of pin grid array CPU socket used with AMD Piledriver and Bulldozer processors and the 9-series chipset. AM3+ is typically used in high-end gaming systems."}, {"term": "AM4", "def": "A type of CPU socket used with AMD Ryzen and Athlon processors and the AM4 family of chipsets, including the 970, 980G, and 990X chipsets. AM4 is typically used in mainstream desktop systems. The socket has 1331 pins in a pin grid array."}, {"term": "back flash", "def": "To revert to an earlier version of BIOS/UEFI after flashing BIOS/UEFI."}, {"term": "BitLocker Encryption", "def": "A utility in Windows 10/8/7 that is used to lock down a hard drive by encrypting the entire Windows volume and any other volume on the drive. Also called BitLocker Encryption."}, {"term": "bus", "def": "The paths, or lines, on the motherboard on which data, instructions, and electrical power move from component to component."}, {"term": "Chipset", "def": "A group of chips on the motherboard that controls the timing and flow of data and instructions to and from the CPU."}, {"term": "CMOS (complementary metal-oxide semiconductor)", "def": "The technology used to manufacture microchips. CMOS chips require less electricity, hold data longer after the electricity is turned off, and produce less heat than earlier technologies. The configuration or setup chip is a CMOS chip."}, {"term": "CMOS battery", "def": "The lithium coin-cell battery on the motherboard used to power the CMOS chip that holds BIOS setup data so that the data is retained when the computer is unplugged."}, {"term": "CMOS RAM", "def": "Memory contained on the CMOS configuration chip."}, {"term": "Compatibility Support Module (CSM)", "def": "A feature of UEFI that allows it to be backward-compatible with legacy BIOS devices and drivers."}, {"term": "device drivers", "def": "A small program stored on the hard drive and installed in Windows that tells Windows how to communicate with a specific hardware device such as a printer, network, port on the motherboard, or scanner."}, {"term": "flashing BIOS/UEFI", "def": "The process of upgrading or refreshing the programming stored on a firmware chip."}, {"term": "FPC (flexible printed circuit) connectors", "def": "Flat and flexible ZIF and non-ZIF connectors used for tight locations in electronic equipment."}, {"term": "GUID Partition Table (GPT)", "def": "A method for partitioning hard drives that allows for drives of any size. For Windows, a drive that uses this method can have up to 128 partitions. The GPT partitioning system is required to use a Secure boot with UEFI firmware."}, {"term": "header", "def": "On a motherboard, a connector that consists of a group of pins that stick up on the board."}, {"term": "IDE (Integrated Drive Electronics)", "def": "A hard drive whose disk controller is integrated into the drive, eliminating the need for a controller cable and thus increasing speed as well as reducing price."}, {"term": "I/O shield", "def": "A plate installed on the rear of a computer case that provides holes for I/O ports coming off the motherboard."}, {"term": "jumper", "def": "Two small posts or metal pins that stick up side by side on a motherboard or other device and are used to hold configuration information. The jumper is considered closed if a cover is over the wires and open if the cover is missing."}, {"term": "land grid array (LGA)", "def": "A socket that has blunt protruding pins in uniform rows that connect with lands or pads on the bottom of the processor. Compare with pin grid array (PGA)."}, {"term": "LGA1150", "def": "A CPU socket for Intel processors that works with 4th and 5th generation chipsets and processors. The socket uses a land grid array and 1150 pins."}, {"term": "LGA1151", "def": "A CPU socket for Intel processors that uses a land grid array and 1151 pins. Two versions of the socket currently exist; the older version works with 6th and 7th generation chipsets and processors, and the newer version works with 8th generation chipsets and processors. The two sockets are not compatible because the pins are used differently on each version of the socket."}, {"term": "LoJack", "def": "A technology by Absolute Software that tracks the whereabouts of a laptop computer and, if the computer is stolen, locks down access to it or erases data on it. The technology is embedded in the BIOS/UEFI of many laptops."}, {"term": "M.2 connector", "def": "A motherboard or expansion card slot that connects to a mini add-on card. The slot uses a PCIe, USB, or SATA interface with the motherboard chipset, and several variations of the slot exist. Also called a Next Generation Form Factor (NGFF) connector."}, {"term": "Master Boot Record (MBR)", "def": "A partitioning system used by hard drives with a capacity less than 2 TB. On an MBR hard drive, the first sector is called the MBR; it contains the partition table and a program motherboard that firmware uses to boot an OS from the drive."}, {"term": "Mini-ITX / mITX", "def": "A smaller version of the microATX form factor. Also called ITX and mITX"}, {"term": "Molex connector", "def": "A 4-pin power connector used to provide power to a PATA hard drive, optical drive, or other internal component."}, {"term": "onboard ports", "def": "A port that is directly on the motherboard, such as a built-in keyboard port or onboard network port."}, {"term": "overclocking", "def": "Running a processor at a higher frequency than that recommended by the manufacturer. Overclocking can result in an unstable system, but it is a popular practice when a computer is used for gaming."}, {"term": "PCI (Peripheral Component Interconnect)", "def": "A bus common to personal computers that uses a 32-bit wide or 64-bit data path. Several variations of PCI exist. On desktop systems, one or more notches on a PCI slot keep the wrong PCI cards from being inserted in the slot."}, {"term": "PCI Express (PCIe)", "def": "An evolution of PCI that is not backward-compatible with earlier PCI slots and cards. PCIe slots come in several sizes, including PCIe ×1, PCIe ×4, PCIe ×8, and PCIe ×16."}, {"term": "pin grid array (PGA)", "def": "A socket that has holes aligned in uniform rows around it to receive the pins on the bottom of the processor. Compare with land grid array (LGA)."}, {"term": "Platform Key (PK)", "def": "A digital signature that belongs to the motherboard or computer manufacturer. The PK authorizes turning Secure boot on or off and updating the KEK database."}, {"term": "Preboot eXecution Environment or Pre-Execution Environment (PXE)", "def": "Programming contained in the BIOS/UEFI code on the motherboard that is used to start up the computer and search for a server on the network to provide a bootable operating system. Also called Pre-Execution Environment (PXE)."}, {"term": "protocol", "def": "A set of rules and standards that two entities use for communication. For example, TCP/IP is a suite or group of protocols that define many types of communication on a TCP/IP network."}, {"term": "riser card", "def": "A card that plugs into a motherboard and allows for expansion cards to be mounted parallel to the motherboard. Expansion cards are plugged into slots on the riser card."}, {"term": "SATA (Serial Advanced Technology Attachment or Serial ATA)", "def": "An interface standard used mostly by hard drives, optical drives, and other storage devices. Current SATA standards include SATA3, SATA2, and eSATA."}, {"term": "Secure boot", "def": "A UEFI and OS feature that prevents a system from booting up with drivers or an OS that is not digitally signed and trusted by the motherboard or computer manufacturer."}, {"term": "small form factor (SFF)", "def": "A motherboard used in low-end computers and home theater systems. An SFF is often used with an Intel Atom processor and sometimes purchased as a motherboard-processor combo unit."}, {"term": "S.M.A.R.T. (Self-Monitoring Analysis and Reporting Technology)", "def": "A BIOS/UEFI and hard drive feature that monitors hard drive performance, disk spin-up time, temperature, distance between the head and the disk, and other mechanical activities of the drive in order to predict when it is likely to fail."}, {"term": "socket", "def": "In computer hardware, a rectangular connector with pins or pads and a mechanism to hold the CPU in place; it is used to connect a CPU to the motherboard"}, {"term": "TPM (Trusted Platform Module) chip", "def": "A chip on a motherboard that holds an encryption key required at startup to access encrypted data on the hard drive. Windows 10/8/7 BitLocker Encryption can use the TPM chip."}, {"term": "TR4 (Threadripper 4)", "def": "A land grid array socket for AMD Ryzen processors and X399 chipsets. The socket is used with high-end AMD processors."}, {"term": "traces", "def": "A wire on a circuit board that connects two components or devices."}, {"term": "UEFI", "def": "An interface between firmware on the motherboard and the operating system. UEFI improves on legacy BIOS processes for managing motherboard settings, booting, handing over the boot to the OS, loading device drivers and applications before the OS loads, and securing the boot to ensure that no rogue operating system hijacks the system."}, {"term": "virtualization", "def": "When one physical machine hosts multiple activities that are normally done on multiple machines."}, {"term": "virtual machine (VM)", "def": "Software managed by a hypervisor that simulates the hardware of a physical computer, creating one or more logical machines within one physical machine."}, {"term": "zero insertion force (ZIF) sockets", "def": "A processor socket with one or two levers on the sides that are used to move the processor out of or into the socket so that equal force is applied over the entire socket housing."}]; let order=[...cards.keys()],idx=0,flipped=false,mastered=new Set(JSON.parse(localStorage.getItem('ch2mastered')||'[]')),correct=0,answered=0,currentMode='flash';
function save(){localStorage.setItem('ch2mastered',JSON.stringify([...mastered]));document.getElementById('mastery').textContent=mastered.size+' mastered'}
function tabs(m){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById('t-'+m).classList.add('active')}
function mode(m){currentMode=m;idx=0;answered=0;correct=0;tabs(m); if(m==='flash')renderFlash(); if(m==='learn')renderLearn(); if(m==='test')startTest(); if(m==='practice')startPractice(); if(m==='terms')renderTerms()}
function prog(){return `<div class="small">${idx+1} / ${order.length}</div><div class="progress"><div class="bar" style="width:${((idx+1)/order.length)*100}%"></div></div>`}
function renderFlash(){let c=cards[order[idx]];document.getElementById('view').innerHTML=prog()+`<div class="flash" onclick="flip()">${flipped?`<div class="def">${c.def}</div>`:c.term}</div><div class="hint">Click the card to flip it</div><div class="row"><button onclick="prev()">← Previous</button><button onclick="shuffle()">Shuffle</button><button onclick="mark()">✓ Know it</button><button class="primary" onclick="next()">Next →</button></div>`}
function flip(){flipped=!flipped;renderFlash()} function next(){idx=(idx+1)%order.length;flipped=false;renderFlash()} function prev(){idx=(idx-1+order.length)%order.length;flipped=false;renderFlash()} function shuffle(){order.sort(()=>Math.random()-.5);idx=0;flipped=false;renderFlash()} function mark(){mastered.add(order[idx]);save();next()}
function sample(arr,n){return [...arr].sort(()=>Math.random()-.5).slice(0,n)}
function renderLearn(){let ci=order[idx%order.length],c=cards[ci],wrong=sample(cards.filter((_,i)=>i!==ci),3).map(x=>x.def),opts=sample([c.def,...wrong],4);document.getElementById('view').innerHTML=prog()+`<div class="small">Choose the correct definition</div><div class="q">${c.term}</div><div class="choices">${opts.map(x=>`<button class="choice" onclick='learnAnswer(this,${JSON.stringify(x)},${JSON.stringify(c.def)})'>${x}</button>`).join('')}</div><div class="small" style="margin-top:14px">Score: ${correct}/${answered}</div>`}
function learnAnswer(btn,a,right){answered++;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(a===right){correct++;btn.classList.add('good');mastered.add(order[idx]);save()}else{btn.classList.add('bad');[...document.querySelectorAll('.choice')].find(b=>b.textContent===right)?.classList.add('good')}setTimeout(()=>{idx=(idx+1)%order.length;renderLearn()},850)}

const practiceQs=[
{q:"You need to fix a system that sometimes hangs during the boot process and also hangs at random times after booting successfully. What could be a possible remedy?",o:["Install new CMOS RAM","Remove the TPM chip","Flash the BIOS/UEFI","Format the hard disk"],a:[2],why:"Flashing/updating the BIOS/UEFI can correct firmware bugs that cause boot or stability problems."},
{q:"Kai needs to compile information on the motherboard brand and model for a few computers running important applications. He does not have the motherboard manuals. How can he obtain the information with relative ease?",o:["Enter the msinfo32.exe command in Windows","Open Control Panel then Device Manager","Access the BIOS/UEFI and print a summary report","Power down, open the case, and take a picture"],a:[0],why:"Windows System Information (msinfo32.exe) provides system and motherboard information without opening the computer."},
{q:"A company is researching motherboards for a small / compact low-end system to be used in a home theater system. Which motherboard form factor is it most likely to use?",o:["ATX","mATX","E-ATX","mITX"],a:[3],why:"Mini-ITX (mITX) is a compact motherboard form factor suited to small systems."},
{q:"You install a virtual machine app such as VMware or VirtualBox, but it reports that virtualization is not supported. Where could you potentially fix the problem?",o:["Windows Control Panel","BIOS/UEFI","TPM chip","Virtualization Jumper"],a:[1],why:"Hardware virtualization support is commonly enabled or disabled in BIOS/UEFI settings."},
{q:"Which statement is NOT true regarding Alder Lake chipsets?",o:["Alder Lake is used with the LGA1700 socket.","Alder Lake belongs to the Z690 chipset family.","Alder Lake processors can have up to 8 cores.","Alder Lake processors include Core i5, i7, and i9."],a:[2],why:"Alder Lake processors can have more than 8 total cores because they can combine Performance and Efficient cores."},
{q:"What must your motherboard have to use BitLocker Encryption in Windows 8/10/11 to help ensure the drive cannot simply be used in another computer?",o:["LoJack","BIOS/UEFI password","Encrypted USB","TPM chip"],a:[3],why:"A TPM can hold encryption keys used by BitLocker."},
{q:"What type of socket ensures that even force is applied when a processor is being installed in the socket?",o:["ZIF","FM2","LGA","AM3"],a:[0],why:"ZIF means Zero Insertion Force; its lever mechanism applies even force across the socket."},
{q:"What has occurred if you see the message, 'Chassis Intruded! System has halted.' the next time you start your computer?",o:["The hard drive has failed","Windows has not been activated","The case has been opened","The POST test has failed"],a:[2],why:"A chassis-intrusion sensor records that the computer case was opened."},
{q:"You decide you want to overclock the processors on your system. What is the first step in the process?",o:["Boot Windows as Administrator, go to Control Panel, set the BIOS/UEFI flag, then restart","Set a motherboard jumper and start the computer; this starts BIOS/UEFI setup","Press a key or combination of keys during POST to access BIOS/UEFI setup","Insert the BIOS setup floppy disk, then reboot"],a:[2],why:"Overclocking settings are typically accessed in BIOS/UEFI, entered during POST."},
{q:"You install Windows on a new SSD that fits in an M.2 socket in a modern high-end motherboard. After installing the OS, the system will not boot as expected. What could be the problem?",o:["You need to install the SSD driver from the SSD manufacturer.","The boot sequence needs to be changed to boot from the SSD.","The M.2 standard can only be used with HDDs and not SSDs.","The motherboard does not support booting from an M.2 device."],a:[1],why:"The firmware may still be trying to boot another device, so the boot order may need to point to the new SSD/Windows Boot Manager."},
{q:"Ana buys a computer from a surplus sale. When she boots it, it asks for a password before the operating system loads. How can she overcome this problem?",o:["Reinstall the operating system and reboot","Insert a bootable USB flash drive and restart","Configure jumpers to clear the BIOS/UEFI settings","Access BIOS/UEFI and clear the user password"],a:[2],why:"On systems that support it, the motherboard clear-settings jumper can reset BIOS/UEFI configuration, including a stored setup password."},
{q:"A processor fits the motherboard socket, but the motherboard chipset is incompatible. What will happen?",o:["Damage to both processor and motherboard","The computer will work fine","The computer will power on but fail POST","You will not be able to install the processor"],a:[2],why:"Physical socket fit does not guarantee chipset/firmware support; an unsupported CPU can prevent successful POST."},
{q:"You are asked to install a new high-end graphics card. In which motherboard slot should you install it?",o:["PCI Express 6.0 x32","PCI Express 5.0 x32","PCI Express 5.0 x16","PCI Express 5.0 x8"],a:[2],why:"Desktop graphics cards normally use the full-length PCIe x16 slot."},
{q:"Jose is about to upgrade the processor in a computer. What should he do first?",o:["Update the RAM","Back up all HDDs and SSDs","Update device drivers for all expansion cards","Update the motherboard firmware if needed"],a:[3],why:"A newer processor may require a BIOS/UEFI update before the motherboard can recognize it."},
{q:"A processor fits an LGA1700 socket. The motherboard must be compatible with what generation of processor and chipset?",o:["Alder Lake","Rocket Lake","Comet Lake","Coffee Lake Refresh","Coffee Lake"],a:[0],why:"LGA1700 was introduced with Intel's Alder Lake generation."},
{q:"PCIe slots have designations representing the number of lanes used to carry data. Which is a valid designation?",o:["x1","x4","x8","x16","All of these choices"],a:[4],why:"PCIe commonly uses x1, x4, x8, and x16 lane designations."},
{q:"Your manager wants you to build a custom computer for a dedicated application. Which is NOT a technical factor that needs to be considered?",o:["What operating system will be installed?","How is the motherboard going to be used?","What form factor does the motherboard use?","What is the price of the motherboard?"],a:[3],why:"The other choices are technical compatibility/use considerations; price is a purchasing consideration."},
{q:"At what point during motherboard installation should you install the motherboard drivers?",o:["Before applying power for the first time","After POST successfully completes","Only if you get a blue screen when Windows boots","After Windows successfully boots without errors"],a:[3],why:"Motherboard/chipset drivers are installed in the operating system after Windows is running."},
{q:"You are troubleshooting a computer and want to review motherboard configuration settings. Where is most of this data stored?",o:["BIOS/UEFI ROM","CMOS RAM","DIMM RAM","HDD"],a:[1],why:"In the terminology used in this chapter, motherboard setup/configuration data is stored in CMOS RAM."},
{q:"Under which THREE conditions would you be inclined to flash (update) the BIOS/UEFI? Select three.",o:["Errors are displayed when trying to install a new OS","An error says the OS is not found","A new version of BIOS/UEFI is made available","You want to incorporate new motherboard features","You want to upgrade the CPU"],a:[2,3,4],why:"A firmware update may be appropriate for a new BIOS/UEFI release, added motherboard features, or CPU support. This question requires three selections.",multi:true}
];
let practiceOrder=[],practiceIndex=0,practiceCorrect=0,practiceAnswered=0,practiceSelected=new Set();
function startPractice(){practiceOrder=sample([...practiceQs.keys()],practiceQs.length);practiceIndex=0;practiceCorrect=0;practiceAnswered=0;practiceSelected=new Set();renderPractice()}
function renderPractice(){if(practiceIndex>=practiceOrder.length){document.getElementById('view').innerHTML=`<div class="q">Practice complete</div><div class="stats"><div class="stat"><div class="big">${practiceCorrect}/${practiceQs.length}</div><div class="small">Correct</div></div><div class="stat"><div class="big">${Math.round(practiceCorrect/practiceQs.length*100)}%</div><div class="small">Score</div></div><div class="stat"><div class="big">20</div><div class="small">Questions</div></div></div><button class="primary" onclick="startPractice()">Practice Again</button>`;return}
let q=practiceQs[practiceOrder[practiceIndex]];practiceSelected=new Set();document.getElementById('view').innerHTML=`<div class="small">Practice question ${practiceIndex+1} of ${practiceQs.length} ${q.multi?'• Select THREE':''}</div><div class="progress"><div class="bar" style="width:${((practiceIndex+1)/practiceQs.length)*100}%"></div></div><div class="q">${q.q}</div><div class="choices">${q.o.map((x,i)=>`<button class="choice" data-i="${i}" onclick="practicePick(this,${i})"><b>${String.fromCharCode(65+i)}.</b> ${x}</button>`).join('')}</div>${q.multi?'<button class="primary" id="submitMulti" onclick="submitPracticeMulti()" style="margin-top:14px">Submit answer</button>':''}<div id="practiceFeedback" style="margin-top:14px"></div><div class="small" style="margin-top:14px">Score: ${practiceCorrect}/${practiceAnswered}</div>`}
function practicePick(btn,i){let q=practiceQs[practiceOrder[practiceIndex]];if(q.multi){if(practiceSelected.has(i)){practiceSelected.delete(i);btn.classList.remove('good')}else if(practiceSelected.size<q.a.length){practiceSelected.add(i);btn.classList.add('good')}return}gradePractice([i])}
function submitPracticeMulti(){let q=practiceQs[practiceOrder[practiceIndex]];if(practiceSelected.size!==q.a.length){document.getElementById('practiceFeedback').innerHTML=`<div class="small">Select ${q.a.length} answers before submitting.</div>`;return}gradePractice([...practiceSelected])}
function gradePractice(sel){let q=practiceQs[practiceOrder[practiceIndex]],ok=sel.length===q.a.length&&sel.every(x=>q.a.includes(x));practiceAnswered++;if(ok)practiceCorrect++;document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;b.classList.remove('good');if(q.a.includes(i))b.classList.add('good');else if(sel.includes(i))b.classList.add('bad')});let letters=q.a.map(i=>String.fromCharCode(65+i)).join(', ');document.getElementById('practiceFeedback').innerHTML=`<div style="font-weight:800">${ok?'✓ Correct':'✗ Correct answer: '+letters}</div><div class="small" style="margin-top:6px">${q.why}</div><button class="primary" onclick="nextPractice()" style="margin-top:12px">${practiceIndex===practiceQs.length-1?'See score':'Next question →'}</button>`;let sm=document.getElementById('submitMulti');if(sm)sm.disabled=true}
function nextPractice(){practiceIndex++;renderPractice()}

let testQs=[];function startTest(){testQs=sample(cards,10);idx=0;correct=0;answered=0;renderTest()}function renderTest(){if(idx>=testQs.length){document.getElementById('view').innerHTML=`<div class="q">Test complete</div><div class="stats"><div class="stat"><div class="big">${correct}/10</div><div class="small">Correct</div></div><div class="stat"><div class="big">${correct*10}%</div><div class="small">Score</div></div><div class="stat"><div class="big">${mastered.size}</div><div class="small">Mastered</div></div></div><button class="primary" onclick="startTest()">New Test</button>`;return}let c=testQs[idx],wrong=sample(cards.filter(x=>x.term!==c.term),3).map(x=>x.term),opts=sample([c.term,...wrong],4);document.getElementById('view').innerHTML=`<div class="small">Question ${idx+1} of 10</div><div class="progress"><div class="bar" style="width:${(idx+1)*10}%"></div></div><div class="q">Which term matches this definition?</div><p>${c.def}</p><div class="choices">${opts.map(x=>`<button class="choice" onclick='testAnswer(this,${JSON.stringify(x)},${JSON.stringify(c.term)})'>${x}</button>`).join('')}</div>`}function testAnswer(btn,a,right){if(a===right){correct++;btn.classList.add('good')}else{btn.classList.add('bad');[...document.querySelectorAll('.choice')].find(b=>b.textContent===right)?.classList.add('good')}document.querySelectorAll('.choice').forEach(b=>b.disabled=true);setTimeout(()=>{idx++;renderTest()},850)}
function renderTerms(){document.getElementById('view').innerHTML=`<input class="input" placeholder="Search terms..." oninput="filterTerms(this.value)"><div class="terms" id="terms" style="margin-top:16px"></div>`;filterTerms('')}function filterTerms(q){let a=cards.filter(c=>(c.term+' '+c.def).toLowerCase().includes(q.toLowerCase()));document.getElementById('terms').innerHTML=a.map(c=>`<div class="termrow"><b>${c.term}</b><span class="small">${c.def}</span></div>`).join('')}
save();renderFlash();
</script></body></html>
